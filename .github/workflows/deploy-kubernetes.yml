name: Deploy to Kubernetes

on:
  workflow_dispatch:
    inputs:
      resetApplication:
        description: Delete application namespace before deployment
        required: true
        type: boolean
        default: false

      resetObservability:
        description: Delete observability namespace before deployment
        required: true
        type: boolean
        default: false

      seed:
        description: Apply database migrations and load sample data
        required: true
        type: boolean
        default: false

      imageTag:
        description: Docker image tag (Git commit SHA)
        required: true

jobs:
  deploy:
    runs-on: self-hosted

    permissions:
      contents: read
      packages: read

    defaults:
      run:
        shell: pwsh

    env:
      NAMESPACE: todo-app
      OBSERVABILITY_NAMESPACE: observability

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # ------------------------------------------------------------
      # Verify tools and cluster
      # ------------------------------------------------------------

      - name: Verify Kubernetes cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Verify Helm
        run: |
          helm version

      # ------------------------------------------------------------
      # Reset namespaces
      # ------------------------------------------------------------

      - name: Reset application namespace
        if: ${{ inputs.resetApplication }}
        run: |
          Write-Host "Deleting namespace '$env:NAMESPACE'..."

          kubectl delete namespace $env:NAMESPACE --ignore-not-found=true

          if ($LASTEXITCODE -eq 0) {
              kubectl wait `
                  --for=delete namespace/$env:NAMESPACE `
                  --timeout=300s
          }

      - name: Reset observability namespace
        if: ${{ inputs.resetObservability }}
        run: |
          Write-Host "Deleting namespace '$env:OBSERVABILITY_NAMESPACE'..."

          kubectl delete namespace $env:OBSERVABILITY_NAMESPACE --ignore-not-found=true

          if ($LASTEXITCODE -eq 0) {
              kubectl wait `
                  --for=delete namespace/$env:OBSERVABILITY_NAMESPACE `
                  --timeout=300s
          }

      # ------------------------------------------------------------
      # Application namespace
      # ------------------------------------------------------------

      - name: Create application namespace
        run: |
          kubectl apply `
              -f infra/kubernetes/todo-app/namespace.yaml

      # ------------------------------------------------------------
      # PostgreSQL
      # ------------------------------------------------------------

      - name: Deploy PostgreSQL
        run: |
          helm upgrade --install postgres `
              infra/helm/todo-app/postgres `
              --namespace $env:NAMESPACE `
              --wait `
              --timeout 5m

      # ------------------------------------------------------------
      # Backend
      # ------------------------------------------------------------

      - name: Deploy backend
        run: |
          Write-Host "Deploying backend image tag: ${{ inputs.imageTag }}"

          helm upgrade --install backend `
              infra/helm/todo-app/backend `
              --namespace $env:NAMESPACE `
              --set-string image.tag="${{ inputs.imageTag }}" `
              --wait `
              --timeout 5m

      # ------------------------------------------------------------
      # Database initialization
      # ------------------------------------------------------------

      - name: Initialize database
        if: ${{ inputs.seed }}
        run: |
          kubectl exec deployment/backend `
              -n $env:NAMESPACE -- `
              alembic upgrade head

          if ($LASTEXITCODE -ne 0) {
              throw "Database migration failed."
          }

          kubectl exec deployment/backend `
              -n $env:NAMESPACE -- `
              python -m app.db.seed.seed

          if ($LASTEXITCODE -ne 0) {
              throw "Seed loading failed."
          }

      # ------------------------------------------------------------
      # Frontend
      # ------------------------------------------------------------

      - name: Deploy frontend
        run: |
          Write-Host "Deploying frontend image tag: ${{ inputs.imageTag }}"

          helm upgrade --install frontend `
              infra/helm/todo-app/frontend `
              --namespace $env:NAMESPACE `
              --set-string image.tag="${{ inputs.imageTag }}" `
              --wait `
              --timeout 5m

      # ------------------------------------------------------------
      # Ingress
      # ------------------------------------------------------------

      - name: Deploy ingress
        run: |
          helm upgrade --install ingress `
              infra/helm/todo-app/ingress `
              --namespace $env:NAMESPACE `
              --wait `
              --timeout 5m

      # ------------------------------------------------------------
      # Observability
      # ------------------------------------------------------------

      - name: Deploy observability resources
        run: |
          kubectl apply `
              -f infra/kubernetes/observability/namespace.yaml

          kubectl apply `
              -f infra/kubernetes/observability/loki/

          kubectl apply `
              -f infra/kubernetes/observability/alloy/

          kubectl apply `
              -f infra/kubernetes/observability/grafana/

      - name: Restart observability workloads
        if: ${{ !inputs.resetObservability }}
        run: |
          Write-Host "Restarting observability workloads to apply configuration changes..."

          kubectl rollout restart deployment/loki `
              -n $env:OBSERVABILITY_NAMESPACE

          kubectl rollout restart daemonset/alloy `
              -n $env:OBSERVABILITY_NAMESPACE

          kubectl rollout restart deployment/grafana `
              -n $env:OBSERVABILITY_NAMESPACE

      - name: Wait for observability stack
        run: |
          kubectl rollout status deployment/loki `
              -n $env:OBSERVABILITY_NAMESPACE `
              --timeout=300s

          kubectl rollout status daemonset/alloy `
              -n $env:OBSERVABILITY_NAMESPACE `
              --timeout=300s

          kubectl rollout status deployment/grafana `
              -n $env:OBSERVABILITY_NAMESPACE `
              --timeout=300s

      # ------------------------------------------------------------
      # Status
      # ------------------------------------------------------------

      - name: Show cluster status
        run: |
          Write-Host ""
          Write-Host "=== Helm releases ==="
          Write-Host ""

          helm list `
              -n $env:NAMESPACE

          Write-Host ""
          Write-Host "=== Application ==="
          Write-Host ""

          kubectl get pods `
              -n $env:NAMESPACE `
              -o wide

          kubectl get svc `
              -n $env:NAMESPACE

          kubectl get ingress `
              -n $env:NAMESPACE

          kubectl get pvc `
              -n $env:NAMESPACE

          Write-Host ""
          Write-Host "=== Observability ==="
          Write-Host ""

          kubectl get pods `
              -n $env:OBSERVABILITY_NAMESPACE `
              -o wide

          kubectl get svc `
              -n $env:OBSERVABILITY_NAMESPACE

          kubectl get daemonsets `
              -n $env:OBSERVABILITY_NAMESPACE
