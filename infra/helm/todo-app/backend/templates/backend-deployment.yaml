apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          command:
            - uvicorn
            - app.main:app
            - --host
            - 0.0.0.0
            - --port
            - {{ .Values.container.port | quote }}

          ports:
            - containerPort: {{ .Values.container.port }}

          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: {{ .Values.container.port }}
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/health/live
              port: {{ .Values.container.port }}
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3

          envFrom:
            - configMapRef:
                name: backend-config

            - secretRef:
                name: backend-secret
