apiVersion: apps/v1
kind: Deployment

metadata:
  name: loki
  namespace: observability

spec:
  replicas: 1

  selector:
    matchLabels:
      app: loki

  template:
    metadata:
      labels:
        app: loki

    spec:
      containers:
        - name: loki
          image: grafana/loki:3.6.0

          args:
            - -config.file=/etc/loki/loki.yaml

          ports:
            - containerPort: 3100

          readinessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3

          volumeMounts:
            - name: config
              mountPath: /etc/loki

      volumes:
        - name: config
          configMap:
            name: loki-config
